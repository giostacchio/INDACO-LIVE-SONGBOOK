<title>INDACO Songbook V3</title>
<style>
:root{--bg:#070b16;--panel:#0e1526;--panel2:#131d33;--line:#25314b;--text:#f7f8fc;--muted:#97a2b8;--accent:#6d5dfc;--accent2:#9f92ff;--chord:#ffb357;--green:#35d07f}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,select{font:inherit}.app{max-width:1100px;margin:auto;padding:18px 16px 100px}
.top{position:sticky;top:0;z-index:20;background:rgba(7,11,22,.96);backdrop-filter:blur(12px);padding:8px 0 14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:13px}.logo{width:52px;height:52px;border-radius:17px;background:linear-gradient(135deg,#4941d5,#211b64);display:grid;place-items:center;font-size:31px;font-weight:900;font-style:italic}
h1{margin:0;font-size:24px}.sub{color:var(--muted);font-size:13px;letter-spacing:.15em;text-transform:uppercase}
.status{margin-left:auto;color:var(--green);border:1px solid #185e3d;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:800}
.hero{padding:24px 0 10px}.eyebrow{color:var(--accent2);font-weight:900;letter-spacing:.18em;font-size:12px}.hero h2{font-size:36px;line-height:1.05;margin:10px 0 8px}.stats{color:var(--muted)}
.toolbar{display:grid;grid-template-columns:1fr auto;gap:9px;margin-top:18px}.search,.select{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:13px 14px}
.tabs{display:flex;gap:8px;overflow:auto;padding:12px 0}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:11px 13px;border-radius:12px;cursor:pointer;white-space:nowrap}.btn.active,.btn.primary{background:var(--accent);border-color:var(--accent);font-weight:800}.btn.small{padding:7px 9px;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:10px;margin-top:8px}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:15px;cursor:pointer}.card:hover{border-color:#4c5d85}.card h3{margin:0 0 8px;font-size:17px}.meta{color:var(--muted);font-size:13px}.badge{display:inline-flex;margin-top:9px;border:1px solid #4b3425;background:#2a1d16;color:#ffb357;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:800}.badge.group{border-color:#343168;background:#18173a;color:#b8b0ff}
.row{display:flex;align-items:center;gap:8px}.spacer{flex:1}.star{background:none;border:0;color:#58637b;font-size:25px}.star.on{color:#ffd166}
.song{display:none}.song.open{display:block}.home.hidden{display:none}.songHead{position:sticky;top:77px;z-index:15;background:rgba(7,11,22,.98);padding:10px 0;border-bottom:1px solid var(--line)}
.songTitle{font-size:29px;margin:10px 0 4px}.controls{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.shift{min-width:45px;text-align:center;font-weight:900;color:var(--chord);padding:10px}
.songBody{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:17px;line-height:1.65;padding:22px 2px 50px}
.chord{color:var(--chord);font-weight:900;background:#2a1d16;border-radius:5px;padding:0 3px}
.section{color:#a9a1ff;font-weight:900}.warning{background:#211b15;border:1px solid #5d4427;border-radius:12px;padding:12px;color:#e7c99f;margin:14px 0}
.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(7,11,22,.97);border-top:1px solid var(--line);padding:8px;display:none;justify-content:center;gap:8px;z-index:30}
.setitem{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:11px;margin-bottom:8px}
.live .top,.live .bottom{display:none!important}.live .app{max-width:none;padding:10px 24px 40px}.live .songHead{top:0;background:#000}.live .songBody{font-size:27px;line-height:1.8}.liveExit{display:none}.live .liveExit{display:block;position:fixed;right:10px;top:10px;z-index:50;opacity:.55}
@media(max-width:650px){.app{padding:12px 12px 90px}.hero h2{font-size:31px}.toolbar{grid-template-columns:1fr}.songHead{top:73px}.songBody{font-size:16px}.live .songBody{font-size:23px}}
</style>
</head>

let current=null,shift=0,eb=false,tab='all',fs=17;
const store={get:(k,d)=>{try{return localStorage.getItem(k)??d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const sharp=['DO','DO#','RE','RE#','MI','FA','FA#','SOL','SOL#','LA','LA#','SI'];
const flat=['DO','REb','RE','MIb','MI','FA','SOLb','SOL','LAb','LA','SIb','SI'];
const idx={'DO':0,'DO#':1,'REb':1,'RE':2,'RE#':3,'MIb':3,'MI':4,'FA':5,'FA#':6,'SOLb':6,'SOL':7,'SOL#':8,'LAb':8,'LA':9,'LA#':10,'SIb':10,'SI':11,
'C':0,'C#':1,'Db':1,'D':2,'D#':3,'Eb':3,'E':4,'F':5,'F#':6,'Gb':6,'G':7,'G#':8,'Ab':8,'A':9,'A#':10,'Bb':10,'B':11};
const enS=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],enF=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function favs(){try{return JSON.parse(store.get('v3favs','[]'))}catch(e){return[]}}
function sets(){try{return JSON.parse(store.get('v3set','[]'))}catch(e){return[]}}
function render(){
 const q=document.getElementById('q').value.toLowerCase().trim(), g=document.getElementById('group').value;
 let arr=SONGS.filter(s=>(g==='all'||s.group===g)&&((s.title+' '+s.artist).toLowerCase().includes(q)));
 if(tab==='fav'){let f=favs();arr=arr.filter(s=>f.includes(s.id))}
 if(tab==='set'){return renderSet()}
 const f=favs(),el=document.getElementById('cards');
 el.innerHTML=arr.map(s=>`<div class="card" onclick="openSong('${s.id}')"><div class="row"><div><h3>${esc(s.title)}</h3><div class="meta">${esc(s.artist||'')}${s.key&&s.key!=='—'?' • Tonalità '+esc(s.key):''}</div><span class="badge group">${esc(s.group)}</span>${s.chords?` <span class="badge">${s.chords} accordi riconosciuti</span>`:''}</div><span class="spacer"></span><button class="star ${f.includes(s.id)?'on':''}" onclick="event.stopPropagation();toggleFav('${s.id}')">★</button></div></div>`).join('')||'<div class="meta">Nessun brano trovato.</div>';
}
function renderSet(){
 let ids=sets(),list=ids.map(id=>SONGS.find(s=>s.id===id)).filter(Boolean);
 cards.innerHTML=`<div style="grid-column:1/-1"><div class="row"><h2>Scaletta personale (${list.length})</h2><span class="spacer"></span><button class="btn small" onclick="clearSet()">Svuota</button></div>${list.map((s,i)=>`<div class="setitem"><b>${i+1}.</b><div style="flex:1" onclick="openSong('${s.id}')"><b>${esc(s.title)}</b><div class="meta">${esc(s.group)}</div></div><button class="btn small" onclick="removeSet('${s.id}')">✕</button></div>`).join('')||'<div class="meta">Scaletta vuota.</div>'}</div>`;
}
function toggleFav(id){let f=favs();f=f.includes(id)?f.filter(x=>x!==id):[...f,id];store.set('v3favs',JSON.stringify(f));render();if(current)updateStar()}
function openSong(id){current=SONGS.find(s=>s.id===id);if(!current)return;shift=parseInt(store.get('v3shift_'+id,'0'))||0;eb=false;home.classList.add('hidden');song.classList.add('open');bottom.style.display='flex';renderSong();window.scrollTo(0,0)}
function goHome(){document.body.classList.remove('live');song.classList.remove('open');home.classList.remove('hidden');bottom.style.display='none';render()}
function noteTrans(n,amt,italian){let i=idx[n];if(i===undefined)return n;let useFlat=n.includes('b');return (italian?(useFlat?flat:sharp):(useFlat?enF:enS))[(i+amt+120)%12]}
function chordTrans(ch,amt){
 let suffix='',bass='',root=ch;
 if(ch.includes('/')){let p=ch.split('/');root=p[0];bass=p.slice(1).join('/')}
 let mi=root.match(/^(DO|RE|MI|FA|SOL|LA|SI)([#b]?)(.*)$/i);
 if(mi){let r=mi[1].toUpperCase()+mi[2];suffix=mi[3];root=noteTrans(r,amt,true)+suffix;if(bass){let b=bass.match(/^(DO|RE|MI|FA|SOL|LA|SI)([#b]?)(.*)$/i);if(b)bass=noteTrans(b[1].toUpperCase()+b[2],amt,true)+b[3]}return root+(bass?'/'+bass:'')}
 let me=root.match(/^([A-G])([#b]?)(.*)$/);if(me){let r=me[1]+me[2];root=noteTrans(r,amt,false)+me[3];if(bass){let b=bass.match(/^([A-G])([#b]?)(.*)$/);if(b)bass=noteTrans(b[1]+b[2],amt,false)+b[3]}return root+(bass?'/'+bass:'')}
 return ch;
}
function renderSong(){
 songTitle.textContent=current.title;
 let shown=current.key&&current.key!=='—'?chordTrans(current.key,shift):'';
 songMeta.textContent=[current.group,current.artist,current.key&&current.key!=='—'?'Originale: '+current.key+(shift?' • Ora: '+shown:''):'',current.source].filter(Boolean).join(' • ');
 shiftBadge.textContent=(shift>0?'+':'')+shift; ebBtn.classList.toggle('active',eb); updateStar();
 let h=esc(current.body).replace(/\{([^}]+)\}/g,(m,c)=>'<span class="chord">'+esc(chordTrans(c,shift))+'</span>').replace(/\[([^\]]+)\]/g,'<span class="section">[$1]</span>');
 songBody.innerHTML=h;songBody.style.fontSize=fs+'px';
 sourceWarn.innerHTML=current.body.startsWith('[PDF ORIGINALE]')?'<div class="warning">Questo PDF è grafico/scansionato: usa “📄 PDF” per vedere la versione originale. La trasposizione automatica richiede testo digitale.</div>':'';
 store.set('v3shift_'+current.id,shift);
}
function updateStar(){let f=favs();songStar.classList.toggle('on',f.includes(current.id));songStar.onclick=()=>toggleFav(current.id)}
function transpose(n){shift=Math.max(-11,Math.min(11,shift+n));renderSong()}
function resetTranspose(){shift=0;eb=false;renderSong()}
function toggleEb(){eb=!eb;shift+=eb?-1:1;shift=Math.max(-11,Math.min(11,shift));renderSong()}
function fontSize(n){fs=Math.max(12,Math.min(36,fs+n));renderSong()}
function openPdf(){alert('Nel file HTML standalone il PDF originale non è incorporato. Usa il pacchetto ZIP/GitHub per aprire anche i PDF.')}
function addSet(){let a=sets();if(!a.includes(current.id)){a.push(current.id);store.set('v3set',JSON.stringify(a));alert('Aggiunto alla scaletta')}}
function removeSet(id){store.set('v3set',JSON.stringify(sets().filter(x=>x!==id)));renderSet()}
function clearSet(){store.set('v3set','[]');renderSet()}
function seq(){let a=sets();let valid=a.filter(id=>SONGS.some(s=>s.id===id));return valid.length?valid:SONGS.map(s=>s.id)}
function nextSong(){let a=seq(),i=a.indexOf(current.id);openSong(a[(i+1+a.length)%a.length])}
function prevSong(){let a=seq(),i=a.indexOf(current.id);openSong(a[(i-1+a.length)%a.length])}
function enterLive(){document.body.classList.add('live');document.documentElement.requestFullscreen?.().catch(()=>{})}
function exitLive(){document.body.classList.remove('live');if(document.fullscreenElement)document.exitFullscreen?.().catch(()=>{})}
q.addEventListener('input',render);group.addEventListener('change',render);
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;render()});
render();
</script>
</body></html>
