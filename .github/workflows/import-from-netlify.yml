name: Import Songbook from Netlify

on:
  push:
    paths:
      - '.github/workflows/import-from-netlify.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download current Songbook
        run: curl -L --fail --retry 3 https://indaco-live-songbook.netlify.app/ -o index.html
      - name: Commit imported app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Import current Indaco Songbook from Netlify"
          git push
